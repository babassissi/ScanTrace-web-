<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — ScanTrace</title>
<style>
  :root {
    --ink: #04070F; --ink-soft: #0A0F1C; --ink-card: #0D1424; --paper: #E7ECF5; --paper-dim: #8CA0B8;
    --accent: #00D4FF; --accent-soft: rgba(0,212,255,0.08); --line: rgba(255,255,255,0.08);
    --danger: #F43F5E; --success: #10B981; --warning: #F59E0B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 32px 20px 64px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
  .header h1 { font-size: 24px; font-weight: 800; margin: 0; }
  .header .sub { font-size: 12px; color: var(--paper-dim); margin-top: 4px; }
  .badge-live { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); border: 1px solid rgba(0,212,255,0.25); padding: 4px 10px; border-radius: 999px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .loading, .error, .denied { text-align: center; padding: 80px 20px; color: var(--paper-dim); }
  .denied { color: var(--danger); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .card {
    background: linear-gradient(175deg, var(--ink-card), var(--ink-soft));
    border: 1px solid var(--line); border-radius: 16px; padding: 18px;
  }
  .card .label { font-size: 10.5px; font-weight: 700; color: var(--paper-dim); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
  .card .value { font-size: 26px; font-weight: 800; }
  .card .value.success { color: var(--success); }
  .card .value.accent { color: var(--accent); }

  .section { margin-bottom: 28px; }
  .section h2 { font-size: 14px; font-weight: 700; margin: 0 0 12px; color: var(--paper); }

  .plan-bars { display: flex; flex-direction: column; gap: 10px; }
  .plan-bar-row { display: flex; align-items: center; gap: 10px; }
  .plan-bar-label { width: 90px; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .plan-bar-track { flex: 1; height: 20px; background: rgba(255,255,255,0.03); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .plan-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s ease; }
  .plan-bar-count { width: 40px; text-align: right; font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .chart-card {
    background: linear-gradient(175deg, var(--ink-card), var(--ink-soft));
    border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px 10px;
  }
  .chart-card .chart-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .chart-card .chart-title { font-size: 12px; font-weight: 700; color: var(--paper); }
  .chart-card .chart-total { font-size: 11px; color: var(--paper-dim); font-variant-numeric: tabular-nums; }
  .chart-card canvas { width: 100%; display: block; }
  .chart-empty { text-align: center; padding: 40px 0; color: var(--paper-dim); font-size: 12px; }

  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th { text-align: left; padding: 8px 10px; color: var(--paper-dim); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.04em; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  tr:last-child td { border-bottom: none; }
  .table-wrap { background: var(--ink-card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .rank { color: var(--accent); font-weight: 800; }
  .mono { font-family: ui-monospace, monospace; font-size: 11px; color: var(--paper-dim); }

  a.back { color: var(--paper-dim); font-size: 13px; text-decoration: none; }
  a.back:hover { color: var(--accent); }

  .feedback-list { display: flex; flex-direction: column; gap: 10px; }
  .feedback-card {
    background: var(--ink-card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px;
  }
  .feedback-card .feedback-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 10px; }
  .feedback-card .feedback-email { font-size: 12px; font-weight: 700; color: var(--accent); }
  .feedback-card .feedback-date { font-size: 10.5px; color: var(--paper-dim); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  .feedback-card .feedback-msg { font-size: 13px; line-height: 1.5; color: var(--paper); white-space: pre-wrap; }
  .feedback-empty { text-align: center; padding: 30px 0; color: var(--paper-dim); font-size: 12px; }

  #loginBox { max-width: 380px; margin: 60px auto; text-align: center; }
  #loginBox input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.03); color: var(--paper); font-size: 14px; margin-bottom: 10px;
  }
  #loginBox button {
    width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--accent); color: var(--ink);
    font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<div class="wrap">
  <a href="index.html" class="back">&larr; Retour au site</a>

  <div class="header" style="margin-top: 16px;">
    <div>
      <h1>Panneau d'administration</h1>
      <div class="sub">ScanTrace — vue d'ensemble en direct</div>
    </div>
    <div class="badge-live"><span class="dot"></span> DONNÉES EN DIRECT</div>
  </div>

  <div id="content">
    <div id="loginBox">
      <p style="color: var(--paper-dim); margin-bottom: 16px;">Connecte-toi avec ton compte admin pour accéder au panneau.</p>
      <input type="email" id="email" placeholder="Adresse e-mail" />
      <input type="password" id="password" placeholder="Mot de passe" />
      <button id="loginBtn">Se connecter</button>
      <p id="loginError" style="color: var(--danger); font-size: 12px; margin-top: 10px;"></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBkFOHdx41k6m3xK6qOKQo3zO8v35g6OhA",
    authDomain: "scantrace-site.firebaseapp.com",
    projectId: "scantrace-site",
    storageBucket: "scantrace-site.firebasestorage.app",
    messagingSenderId: "570254848893",
    appId: "1:570254848893:web:693472ee28969bfc041214",
    measurementId: "G-T03DEJQNLL",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const PROXY_URL = "https://scantrace-proxy-cnh7.vercel.app";
  const content = document.getElementById('content');

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errEl = document.getElementById('loginError');
    errEl.textContent = '';
    try {
      await auth.signInWithEmailAndPassword(email, password);
    } catch (e) {
      errEl.textContent = "Identifiants incorrects.";
    }
  });

  function planColor(plan) {
    return { free: '#8CA0B8', starter: '#00D4FF', growth: '#38BDF8', premium: '#A78BFA', admin: '#10B981' }[plan] || '#8CA0B8';
  }
  function planLabel(plan) {
    return { free: 'Gratuit', starter: 'Starter', growth: 'Growth', premium: 'Premium', admin: 'Admin' }[plan] || plan;
  }
  function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s || '';
    return div.innerHTML;
  }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return iso; }
  }
  function shortDay(dateStr) {
    try { return new Date(dateStr + 'T00:00:00Z').toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', timeZone: 'UTC' }); }
    catch (e) { return dateStr; }
  }
  function shortMonth(monthStr) {
    try { return new Date(monthStr + '-01T00:00:00Z').toLocaleDateString('fr-FR', { month: 'short', year: '2-digit', timeZone: 'UTC' }); }
    catch (e) { return monthStr; }
  }

  /** Petite courbe en aire remplie, dessinée en Canvas natif — pas de dépendance
   *  externe. points: [{ value, label }]. Redimensionnée à la largeur réelle du
   *  conteneur pour rester nette sur écrans haute densité (devicePixelRatio). */
  function drawLineChart(canvasId, points, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas || !points || points.length === 0) return;

    const cssWidth = canvas.parentElement.clientWidth;
    const cssHeight = 180;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = cssWidth * dpr;
    canvas.height = cssHeight * dpr;
    canvas.style.width = cssWidth + 'px';
    canvas.style.height = cssHeight + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, cssWidth, cssHeight);

    // Marge droite plus généreuse + libellés ancrés (gauche/centre/droite)
    // pour qu'aucun texte ne dépasse jamais le bord du canvas.
    const padL = 32, padR = 14, padT = 14, padB = 20;
    const w = cssWidth - padL - padR;
    const h = cssHeight - padT - padB;
    const maxVal = Math.max(1, Math.round(Math.max(...points.map((p) => p.value))));

    // Graduations entières et jamais dupliquées : au plus une par unité
    // quand les valeurs sont petites, sinon 3 paliers arrondis.
    const tickCount = Math.min(3, maxVal);
    const ticks = [];
    for (let i = 0; i <= tickCount; i++) ticks.push(Math.round((maxVal * i) / tickCount));

    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.fillStyle = '#8CA0B8';
    ctx.font = '10px ui-monospace, SFMono-Regular, monospace';
    ctx.textAlign = 'right';
    ticks.forEach((val) => {
      const y = padT + h - (maxVal > 0 ? (val / maxVal) * h : 0);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + w, y);
      ctx.stroke();
      ctx.fillText(String(val), padL - 8, y + 3);
    });

    // Un seul point : rien à relier. On le centre et on l'affiche seul,
    // plutôt qu'un point isolé collé au bord gauche (illisible).
    const single = points.length === 1;
    const stepX = points.length > 1 ? w / (points.length - 1) : 0;
    const coords = points.map((p, i) => ({
      x: single ? padL + w / 2 : padL + stepX * i,
      y: padT + h - (p.value / maxVal) * h,
    }));

    if (!single) {
      const grad = ctx.createLinearGradient(0, padT, 0, padT + h);
      grad.addColorStop(0, color + '55');
      grad.addColorStop(1, color + '00');
      ctx.beginPath();
      ctx.moveTo(coords[0].x, padT + h);
      coords.forEach((c) => ctx.lineTo(c.x, c.y));
      ctx.lineTo(coords[coords.length - 1].x, padT + h);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      ctx.beginPath();
      coords.forEach((c, i) => (i === 0 ? ctx.moveTo(c.x, c.y) : ctx.lineTo(c.x, c.y)));
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.stroke();
    }

    const last = coords[coords.length - 1];
    ctx.beginPath();
    ctx.arc(last.x, last.y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();

    ctx.fillStyle = '#8CA0B8';
    const labelEvery = Math.max(1, Math.ceil(points.length / 6));
    const lastX = coords[coords.length - 1].x;
    const minGap = 46; // évite qu'un libellé régulier chevauche le dernier, toujours affiché
    points.forEach((p, i) => {
      const isLast = i === points.length - 1;
      if (!single && !isLast) {
        if (i % labelEvery !== 0) return;
        if (lastX - coords[i].x < minGap) return;
      }
      // Ancrage aux extrémités pour ne jamais dépasser le canvas ; centré ailleurs.
      ctx.textAlign = single || (i > 0 && !isLast) ? 'center' : i === 0 ? 'left' : 'right';
      ctx.fillText(p.label, coords[i].x, cssHeight - 5);
    });
  }

  async function loadDashboard(user) {
    content.innerHTML = '<div class="loading">Chargement des donn\u00e9es\u2026</div>';
    try {
      const idToken = await user.getIdToken();
      const res = await fetch(`${PROXY_URL}/api/admin-stats`, { headers: { Authorization: `Bearer ${idToken}` } });
      const data = await res.json();

      if (res.status === 403) {
        content.innerHTML = `<div class="denied">Acc\u00e8s refus\u00e9 \u2014 ce compte (${user.email}) n'est pas administrateur.</div>`;
        return;
      }
      if (!res.ok) {
        content.innerHTML = `<div class="error">Erreur : ${data.error || 'inconnue'}</div>`;
        return;
      }

      const maxPlanCount = Math.max(1, ...Object.values(data.planCounts));

      content.innerHTML = `
        <div class="grid">
          <div class="card"><div class="label">Utilisateurs totaux</div><div class="value">${data.totalUsers}</div></div>
          <div class="card"><div class="label">Revenu mensuel estim\u00e9</div><div class="value success">${data.mrr.toFixed(2)}&euro;</div></div>
          <div class="card"><div class="label">Tokens utilis\u00e9s ce mois</div><div class="value accent">${data.tokensUsedThisMonth}</div></div>
          <div class="card"><div class="label">Comptes actifs ce mois</div><div class="value">${data.activeUsersThisMonth}</div></div>
          <div class="card"><div class="label">Parrainages r\u00e9ussis</div><div class="value">${data.totalReferrals}</div></div>
          <div class="card"><div class="label">Tokens bonus distribu\u00e9s</div><div class="value">${data.totalBonusTokens}</div></div>
        </div>

        <div class="chart-grid">
          <div class="chart-card">
            <div class="chart-head">
              <div class="chart-title">Inscriptions \u2014 30 derniers jours</div>
              <div class="chart-total">${data.signupsByDay.reduce((s, p) => s + p.count, 0)} au total</div>
            </div>
            <canvas id="signupsChart" height="180"></canvas>
          </div>
          <div class="chart-card">
            <div class="chart-head">
              <div class="chart-title">Tokens utilis\u00e9s par mois</div>
              <div class="chart-total">${data.tokensByMonth.reduce((s, p) => s + p.count, 0)} au total</div>
            </div>
            ${data.tokensByMonth.length ? '<canvas id="tokensChart" height="180"></canvas>' : '<div class="chart-empty">Pas encore de donn\u00e9es d\u2019usage.</div>'}
          </div>
        </div>

        <div class="section">
          <h2>R\u00e9partition par plan</h2>
          <div class="plan-bars">
            ${Object.entries(data.planCounts).map(([plan, count]) => `
              <div class="plan-bar-row">
                <div class="plan-bar-label" style="color:${planColor(plan)}">${planLabel(plan)}</div>
                <div class="plan-bar-track"><div class="plan-bar-fill" style="width:${(count / maxPlanCount) * 100}%; background:${planColor(plan)};"></div></div>
                <div class="plan-bar-count">${count}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <div class="section">
          <h2>Top parrains</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>#</th><th>UID</th><th>Amis parrain\u00e9s</th><th>Tokens bonus</th></tr></thead>
              <tbody>
                ${data.topReferrers.length ? data.topReferrers.map((r, i) => `
                  <tr><td class="rank">${i + 1}</td><td class="mono">${r.uid.slice(0, 12)}\u2026</td><td>${r.referralCount}</td><td>+${r.bonusTokens}</td></tr>
                `).join('') : '<tr><td colspan="4" style="text-align:center; color: var(--paper-dim);">Aucun parrainage pour le moment</td></tr>'}
              </tbody>
            </table>
          </div>
        </div>

        <div class="section">
          <h2>Avis b\u00eata r\u00e9cents (app)</h2>
          <div class="feedback-list">
            ${data.recentFeedback.length ? data.recentFeedback.map((f) => `
              <div class="feedback-card">
                <div class="feedback-head">
                  <span class="feedback-email">${f.email || 'Anonyme'}</span>
                  <span class="feedback-date">${f.createdAt ? fmtDate(f.createdAt) : ''}</span>
                </div>
                <div class="feedback-msg">${escapeHtml(f.message)}</div>
              </div>
            `).join('') : '<div class="feedback-empty">Aucun avis pour le moment.</div>'}
          </div>
        </div>

        <div class="section">
          <h2>Inscriptions r\u00e9centes</h2>
          <div class="table-wrap">
            <table>
              <thead><tr><th>E-mail</th><th>Date</th></tr></thead>
              <tbody>
                ${data.recentSignups.map((u) => `
                  <tr><td>${u.email || '(sans e-mail)'}</td><td class="mono">${fmtDate(u.createdAt)}</td></tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;

      drawLineChart(
        'signupsChart',
        data.signupsByDay.map((p) => ({ value: p.count, label: shortDay(p.date) })),
        '#00D4FF',
      );
      if (data.tokensByMonth.length) {
        drawLineChart(
          'tokensChart',
          data.tokensByMonth.map((p) => ({ value: p.count, label: shortMonth(p.month) })),
          '#A78BFA',
        );
      }
    } catch (e) {
      content.innerHTML = `<div class="error">Erreur de connexion \u00e0 l'API.</div>`;
    }
  }

  auth.onAuthStateChanged((user) => {
    if (user) loadDashboard(user);
  });
</script>
</body>
</html>
