<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Abonnement confirm\u00e9 — ScanTrace</title>
<style>
  :root {
    --ink: #04070F; --ink-soft: #0A0F1C; --paper: #E7ECF5; --paper-dim: #8CA0B8;
    --accent: #00D4FF; --line: rgba(255,255,255,0.1); --success: #10B981;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
  }
  .card { max-width: 380px; }
  .icon {
    width: 64px; height: 64px; border-radius: 50%; background: rgba(16,185,129,0.1);
    border: 1px solid rgba(16,185,129,0.3); display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px; color: var(--success); font-size: 28px;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
  p { font-size: 14px; color: var(--paper-dim); line-height: 1.6; margin: 0 0 24px; }
  button {
    padding: 13px 28px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 700; background: var(--accent); color: var(--ink);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#10003;</div>
    <h1>Abonnement activ\u00e9</h1>
    <p>Ton nouveau palier est actif. Le changement peut prendre jusqu'\u00e0 une minute pour s'appliquer.</p>
    <button onclick="window.location.href='index.html'">Retour au site</button>
  </div>
</body>
</html>
