<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — ScanTrace</title>
<style>
  :root {
    --ink: #04070F; --ink-soft: #0A0F1C; --paper: #E7ECF5; --paper-dim: #8CA0B8;
    --accent: #00D4FF; --line: rgba(255,255,255,0.1); --danger: #F43F5E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink); color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 20px; padding: 32px 28px;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--paper-dim); margin: 0 0 24px; }
  input {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255,255,255,0.03); color: var(--paper); font-size: 14px; margin-bottom: 10px;
  }
  input:focus { outline: none; border-color: var(--accent); }
  button {
    width: 100%; padding: 13px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 14px; font-weight: 700; margin-bottom: 10px;
  }
  .btn-primary { background: var(--accent); color: var(--ink); }
  .btn-google {
    background: rgba(255,255,255,0.05); color: var(--paper); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-link { background: transparent; color: var(--paper-dim); font-weight: 500; font-size: 12.5px; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--paper-dim); font-size: 11px; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .error { color: var(--danger); font-size: 12.5px; margin: -4px 0 10px; min-height: 16px; }
  .status { text-align: center; font-size: 13px; color: var(--paper-dim); margin-top: 10px; }
  #app-return { display: none; }
</style>
</head>
<body>

<div class="card">
  <h1>Connexion ScanTrace</h1>
  <p class="sub">50 analyses/jour au lieu de 5 — gratuit.</p>

  <button class="btn-google" id="googleBtn">
    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.68-3.87 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
    Continuer avec Google
  </button>

  <div class="divider">OU PAR E-MAIL</div>

  <input type="email" id="email" placeholder="Adresse e-mail" autocomplete="email" />
  <input type="password" id="password" placeholder="Mot de passe" autocomplete="current-password" />
  <div class="error" id="errorMsg"></div>

  <button class="btn-primary" id="loginBtn">Se connecter</button>
  <button class="btn-link" id="signupBtn">Pas de compte ? Cr&eacute;er un compte</button>

  <div class="status" id="statusMsg"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script>
  // ── Colle ici la config Web de ton projet Firebase ─────────────────────
  // Firebase Console -> Param\u00e8tres du projet -> Tes applications -> App Web
  const firebaseConfig = {
    apiKey: "COLLE_TA_CLE_API_ICI",
    authDomain: "COLLE_TON_AUTH_DOMAIN_ICI",
    projectId: "COLLE_TON_PROJECT_ID_ICI",
    appId: "COLLE_TON_APP_ID_ICI",
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();

  const errorMsg = document.getElementById('errorMsg');
  const statusMsg = document.getElementById('statusMsg');

  function showError(msg) { errorMsg.textContent = msg; }

  // Une fois connect\u00e9, redirige vers l'app via deep link avec le token
  async function returnToApp(user) {
    statusMsg.textContent = "Connexion r\u00e9ussie \u2014 retour \u00e0 l'application\u2026";
    const idToken = await user.getIdToken();
    const email = encodeURIComponent(user.email || '');
    const deepLink = `scantrace://auth?token=${idToken}&email=${email}`;
    window.location.href = deepLink;

    // Si la redirection automatique ne fonctionne pas (certains navigateurs
    // bloquent les schemes custom sans clic direct), affiche un bouton.
    setTimeout(() => {
      statusMsg.innerHTML = `Si l'application ne s'est pas ouverte automatiquement : <br><a href="${deepLink}" style="color:#00D4FF">Retourner \u00e0 l'app</a>`;
    }, 1500);
  }

  document.getElementById('googleBtn').addEventListener('click', async () => {
    showError('');
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      const result = await auth.signInWithPopup(provider);
      await returnToApp(result.user);
    } catch (e) {
      showError(e.message);
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    showError('');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showError('Renseigne ton e-mail et ton mot de passe.'); return; }
    try {
      const result = await auth.signInWithEmailAndPassword(email, password);
      await returnToApp(result.user);
    } catch (e) {
      showError("Identifiants incorrects, ou compte inexistant.");
    }
  });

  document.getElementById('signupBtn').addEventListener('click', async () => {
    showError('');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    if (!email || !password) { showError('Renseigne un e-mail et un mot de passe (6 caract\u00e8res min).'); return; }
    try {
      const result = await auth.createUserWithEmailAndPassword(email, password);
      await returnToApp(result.user);
    } catch (e) {
      showError(e.code === 'auth/email-already-in-use' ? 'Ce compte existe d\u00e9j\u00e0 \u2014 connecte-toi.' : e.message);
    }
  });
</script>
</body>
</html>
